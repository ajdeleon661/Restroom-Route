<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Restroom Route</title>
</head>
<body>
    <h1 class="text-5xl bg-lightblue rounded-lg font-bold">Welcome to the Bathroom Locator</h1>
    <p>Find the Nearest Bathroom with Ease!</p>
    
    <!-- Search by Address Section -->
    <div>
        <input type="text" id="location-input" placeholder="Enter Another Location">
        <button id="location-search-btn">Search</button>
    </div>
    
    <!-- Results Section -->
    <aside id="results">
        <ul>
            <!-- Results will be inserted here -->
        </ul>
    </aside>    
    
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Custom JavaScript -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBKVO0gLbjKvibOm6rxkhG23abD2DbeRm0&loading=async&libraries=places&callback=initMap" async defer></script>
    <script src="JavaScript/script.js"></script>
</body>
</html>
